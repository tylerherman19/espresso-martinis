<!DOCTYPE html>

<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<body>
<div class="site-shell">
  <header class="masthead">

      <div class="masthead-stamp" id="stamp">LOADING</div>

        <option value="price-asc">Cheapest first</option>
        <option value="price-desc">Priciest first</option>

    <section id="view-map" class="view hidden"><div id="map"></div></section>
  </main>
  <footer class="footer">
    <p>Prices as listed on each restaurant's own current menu. Not affiliated with, or endorsed by, any restaurant listed. If a menu changed today, the next sweep catches it.</p>
  </footer>
</div>
