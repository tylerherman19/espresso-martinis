<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Espresso Martini Wall | Milwaukee</title>
<meta name="description" content="Every Milwaukee espresso martini we can price, organized by district.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="styles.css?v=7">
</head>
<body>
<nav id="bar">
  <span class="b" id="bar-brand">The Wall</span>
  <input id="find" class="find" type="search" placeholder="Find a spot" aria-label="Find a spot">
  <button id="hh-btn" type="button" aria-pressed="false">HH</button>
  <button id="map-btn" type="button">Map</button>
</nav>
<header class="mast">
  <div class="rule"></div><div class="rule2"></div>
  <div class="dt"><span>Milwaukee, Wis.</span><span id="dt-date">&nbsp;</span><span>No. 7</span></div>
  <h1>The Espresso<br>Martini Wall</h1>
  <div class="idx">
    <div><b id="stat-spots">0</b><span>spots</span></div>
    <div><b id="stat-cheapest">$0</b><span>cheapest</span></div>
    <div><b id="stat-hh">0</b><span>happy hours</span></div>
  </div>
</header>
<main id="wall"><div class="loading">LOADING</div></main>
<div id="backdrop" class="hidden"></div>
<aside id="sheet" class="hidden" aria-label="Spot details"></aside>
<div id="map-overlay" class="hidden">
  <div class="overlay-bar"><span class="overlay-title" id="map-title">Map</span><button class="close-map" id="close-map" type="button">Close</button></div>
  <div id="map"></div>
</div>
<footer class="footer"><p>Prices pulled from online menus and ordering platforms. Happy-hour pricing when the venue posts one. A sweep, not a guarantee: menus change, platforms lag, and the register is the final word.</p></footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js?v=7"></script>
</body>
</html>
