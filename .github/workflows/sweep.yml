name: Sweep for espresso martinis

on:
  workflow_dispatch:
  schedule:
    - cron: '15 5 * * 3'

permissions:
  contents: write

concurrency:
  group: martini-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Test the sweep before trusting it
        run: python -m unittest discover tests
      # Exits non-zero, writing nothing, when the list would collapse. That
      # skips the commit below and GitHub emails the failed run.
      - name: Sweep and write data/martinis.json
        id: sweep
        run: python scripts/sweep.py
      - name: Commit if changed
        run: |
          git config user.name 'martini-sweep[bot]'
          git config user.email 'actions@github.com'
          git add data/martinis.json
          git diff --cached --quiet || git commit -m "Sweep $(date -u +%Y-%m-%d): espresso martini index refresh"
          # A code push may have landed mid-run; fold it in instead of failing.
          git pull --rebase origin main
          git push
      # A source that did not answer still lets the run commit (its spots keep
      # their last reading), but the run goes red so somebody looks.
      - name: Fail if a source did not answer
        if: steps.sweep.outputs.degraded == 'true'
        run: |
          echo "::error::A source did not answer this week. Its spots kept their last reading; the sweep step's summary says which."
          exit 1
