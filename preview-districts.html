<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Espresso Martinis by District | Milwaukee</title>
<meta name="description" content="Where to get an espresso martini in Milwaukee, and what it costs.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
:root { --paper:#F5F4F0; --ink:#1B1A17; --muted:#6F6A5E; --line:#DAD6CB; --accent:#2E5339; --gutter:clamp(16px,4vw,40px); }
* { box-sizing:border-box; }
html { background:var(--paper); color:var(--ink); font-family:'Fraunces',Georgia,serif; }
body { margin:0; min-width:320px; font-size:15px; }
button,input { font:inherit; color:inherit; }
.hidden { display:none !important; }
#bar { position:sticky; top:0; z-index:500; background:var(--paper); border-bottom:1px solid var(--ink); display:flex; align-items:center; gap:8px; padding:9px var(--gutter); }
#bar .b { font-weight:600; font-size:16px; letter-spacing:-.01em; }
#bar .find { flex:1 1 auto; min-width:0; border:1px solid var(--ink); background:var(--paper); border-radius:0; padding:6px 9px; font-family:'IBM Plex Mono',monospace; font-size:11.5px; }
#hh-btn { border:1px solid var(--ink); background:var(--paper); border-radius:0; padding:6px 9px; font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; cursor:pointer; white-space:nowrap; }
#hh-btn.on { background:var(--accent); border-color:var(--accent); color:var(--paper); }
#map-btn { border:1px solid var(--ink); background:var(--ink); color:var(--paper); border-radius:0; padding:6px 9px; font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; cursor:pointer; }
.mast { text-align:center; padding:30px var(--gutter) 8px; }
.mast .k { font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:.22em; color:var(--accent); text-transform:uppercase; }
.mast h1 { margin:6px 0 0; font-weight:500; font-size:clamp(30px,7.5vw,48px); letter-spacing:-.02em; line-height:1.05; }
.mast .s { margin-top:8px; font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:.14em; color:var(--muted); text-transform:uppercase; }
.drow { display:flex; align-items:baseline; gap:10px; width:100%; text-align:left; background:none; border:0; border-top:1px solid var(--line); padding:15px var(--gutter); cursor:pointer; }
.drow:first-of-type { border-top:1px solid var(--ink); }
.drow .n { font-weight:500; font-size:clamp(20px,5vw,26px); letter-spacing:-.015em; }
.drow .meta { margin-left:auto; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.1em; color:var(--muted); text-transform:uppercase; text-align:right; white-space:nowrap; }
.drow .meta .hh { color:var(--accent); }
.drow .arr { font-family:'IBM Plex Mono',monospace; color:var(--muted); }
.drow:active { background:#EDEAE2; }
.section-tag { padding:22px var(--gutter) 6px; font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:.2em; color:var(--accent); text-transform:uppercase; }
#view-d .dhead { padding:18px var(--gutter) 4px; }
#view-d .back { border:none; background:none; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); cursor:pointer; padding:0; }
#view-d h1 { margin:6px 0 0; font-weight:500; font-size:clamp(30px,7.5vw,44px); letter-spacing:-.02em; }
#view-d .dstats { margin-top:6px; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.12em; color:var(--muted); text-transform:uppercase; }
#cards { display:flex; gap:10px; overflow-x:auto; scroll-snap-type:x mandatory; padding:14px var(--gutter); scrollbar-width:none; }
#cards::-webkit-scrollbar { display:none; }
.card { flex:0 0 78vw; max-width:340px; scroll-snap-align:center; border:1px solid var(--ink); background:var(--paper); padding:14px; box-shadow:4px 4px 0 rgba(27,26,23,.1); }
.card .cname { font-weight:600; font-size:19px; letter-spacing:-.01em; line-height:1.15; }
.card .cprice { margin-top:4px; font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:22px; }
.card .cprice .hh { color:var(--accent); font-size:12px; letter-spacing:.08em; }
.card .citems { margin-top:10px; border-top:1px solid var(--line); padding-top:8px; }
.card .citem { display:flex; justify-content:space-between; gap:10px; font-size:13px; padding:2px 0; }
.card .citem b { font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:12px; white-space:nowrap; }
.card .citem b.hh { color:var(--accent); }
.card .caddr { margin-top:10px; font-family:'IBM Plex Mono',monospace; font-size:9.5px; color:var(--muted); line-height:1.5; }
.card .pin-link { margin-top:8px; display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); background:none; border:none; border-bottom:1px solid var(--accent); padding:0 0 1px; cursor:pointer; }
#cnav { display:flex; align-items:center; justify-content:center; gap:16px; padding:2px 0 20px; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted); }
#cnav button { border:1px solid var(--ink); background:var(--paper); border-radius:0; width:34px; height:30px; cursor:pointer; font-family:'IBM Plex Mono',monospace; }
#map-overlay { position:fixed; inset:0; z-index:1000; background:var(--paper); display:flex; flex-direction:column; }
#map-overlay .overlay-bar { display:flex; align-items:center; gap:10px; padding:10px var(--gutter); border-bottom:1px solid var(--ink); }
#map-overlay .overlay-title { font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); }
#map-overlay .close-map { margin-left:auto; border:1px solid var(--ink); background:var(--paper); font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.08em; text-transform:uppercase; padding:6px 12px; cursor:pointer; }
#map { flex:1 1 auto; width:100%; }
.price-pin { background:var(--paper); color:var(--ink); border:1.5px solid var(--ink); font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:10.5px; padding:2px 5px; white-space:nowrap; box-shadow:2px 2px 0 rgba(27,26,23,.18); }
.price-pin.cheapest { background:var(--accent); color:var(--paper); border-color:var(--accent); }
.footer { padding:22px var(--gutter) 42px; border-top:1px solid var(--ink); margin-top:26px; }
.footer p { margin:0; font-size:12px; line-height:1.6; color:var(--muted); max-width:60ch; }
</style>
</head>
<body>
<div id="bar">
  <span class="b">EM</span>
  <input class="find" id="find" type="search" placeholder="Find a spot" aria-label="Find a spot">
  <button id="hh-btn" type="button" aria-pressed="false">Happy hour</button>
  <button id="map-btn" type="button">Map</button>
</div>

<div id="view-home">
  <div class="mast">
    <div class="k">Espresso Martinis</div>
    <h1>Pick a district.</h1>
    <div class="s" id="stamp">LOADING</div>
  </div>
  <div class="section-tag">The core</div>
  <div id="rows-core"></div>
  <div class="section-tag">Beyond the core</div>
  <div id="rows-metro"></div>
</div>

<div id="view-d" class="hidden">
  <div class="dhead">
    <button class="back" id="back-home" type="button">&#8592; All districts</button>
    <h1 id="d-name"></h1>
    <div class="dstats" id="d-stats"></div>
  </div>
  <div id="cards"></div>
  <div id="cnav">
    <button id="cprev" type="button" aria-label="Previous">&#8592;</button>
    <span id="ccount"></span>
    <button id="cnext" type="button" aria-label="Next">&#8594;</button>
  </div>
  <footer class="footer"><p>Prices as listed on each restaurant's own current menu. Not affiliated with, or endorsed by, any restaurant listed.</p></footer>
</div>

<div id="map-overlay" class="hidden">
  <div class="overlay-bar"><span class="overlay-title" id="map-title"></span><button class="close-map" id="close-map" type="button">Close</button></div>
  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
const $ = s => document.querySelector(s);
const money = c => '$' + (c/100).toFixed(c%100===0?0:2);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
let SPOTS=[], HH=false, QUERY='', MAP=null, MARKERS={}, CUR=null;
const shownPrice = s => (HH && s.hh_price_cents) ? s.hh_price_cents : s.price_cents;
const BOXES = {
  'Deer District':[43.0430,43.0480,-87.9190,-87.9120], 'Theater District':[43.0370,43.0430,-87.9170,-87.9085],
  'Third Ward':[43.0295,43.0370,-87.9125,-87.9000], "Walker's Point":[43.0160,43.0300,-87.9200,-87.9000],
  'Brady Street':[43.0450,43.0565,-87.9100,-87.8850], 'North Avenue':[43.0565,43.0620,-87.9160,-87.8800],
  'Downtown':[43.0350,43.0465,-87.9300,-87.8980]
};
const MATCH = ['Deer District','Theater District','Third Ward',"Walker's Point",'Brady Street','North Avenue','Downtown'];
const CORE = ['Deer District','Theater District','Downtown','Third Ward',"Walker's Point",'Brady Street','North Avenue'];
const districtOf = s => { for (const n of MATCH){const b=BOXES[n]; if(s.lat>=b[0]&&s.lat<=b[1]&&s.lng>=b[2]&&s.lng<=b[3]) return n;} return null; };
const matchesQ = s => { const q=QUERY.trim().toLowerCase(); if(!q) return true;
  return s.name.toLowerCase().includes(q)||(s.neighborhood||'').toLowerCase().includes(q)||(districtOf(s)||'').toLowerCase().includes(q)||s.items.some(it=>it.item.toLowerCase().includes(q)); };
const visible = s => (!HH || s.happy_hour) && matchesQ(s);

function groupStats(list){
  const min=Math.min(...list.map(s=>s.price_cents)), max=Math.max(...list.map(s=>s.price_cents));
  const hh=list.filter(s=>s.happy_hour).length;
  return {min,max,hh};
}
function rowHtml(name,list){
  const {min,max,hh}=groupStats(list);
  return `<button class="drow" data-d="${esc(name)}" type="button">
    <span class="n">${esc(name)}</span>
    <span class="meta">${list.length} SPOT${list.length===1?'':'S'} &middot; ${money(min)}&ndash;${money(max)}${hh?` <span class="hh">&middot; ${hh} HH</span>`:''}</span>
    <span class="arr">&#8594;</span></button>`;
}
function renderHome(){
  const core=$('#rows-core'), metro=$('#rows-metro');
  let ch='', mh='';
  CORE.forEach(n=>{ const l=SPOTS.filter(s=>districtOf(s)===n&&visible(s)); if(l.length) ch+=rowHtml(n,l); });
  const hoods={};
  SPOTS.filter(s=>!districtOf(s)&&visible(s)).forEach(s=>{const h=s.neighborhood||'Milwaukee';(hoods[h]=hoods[h]||[]).push(s);});
  Object.keys(hoods).sort().forEach(h=>{ if(hoods[h].length>=3){ mh+=rowHtml(h,hoods[h]); delete hoods[h]; } });
  const tail=[].concat(...Object.values(hoods));
  if(tail.length) mh+=rowHtml('Around the metro',tail);
  core.innerHTML=ch||'<div style="padding:16px var(--gutter);color:var(--muted)">No matches in the core.</div>';
  metro.innerHTML=mh;
  document.querySelectorAll('.drow').forEach(b=>b.addEventListener('click',()=>openDistrict(b.dataset.d)));
}
function openDistrict(name){
  CUR=name;
  const list=SPOTS.filter(s=>((name==='Around the metro')?(!districtOf(s)&&!inBigHood(s)):((districtOf(s)||(s.neighborhood||'Milwaukee'))===name))&&visible(s))
    .sort((a,b)=>shownPrice(a)-shownPrice(b)||a.name.localeCompare(b.name));
  $('#view-home').classList.add('hidden'); $('#view-d').classList.remove('hidden');
  window.scrollTo(0,0);
  $('#d-name').textContent=name;
  const {min,max,hh}=groupStats(list);
  $('#d-stats').textContent=`${list.length} SPOTS · ${money(min)} to ${money(max)}${hh?` · ${hh} WITH HAPPY HOUR`:''}`;
  $('#cards').innerHTML=list.map(s=>{
    const p=shownPrice(s);
    return `<div class="card">
      <div class="cname">${esc(s.name)}</div>
      <div class="cprice">${money(p)}${(HH&&s.hh_price_cents)?' <span class="hh">HAPPY HOUR</span>':''}</div>
      <div class="citems">${s.items.map(it=>{
        const reg=it.price_cents?money(it.price_cents):''; const hhp=it.hh_price_cents?money(it.hh_price_cents)+' hh':'';
        const isHH=HH&&it.hh_price_cents;
        return `<div class="citem"><span>${esc(it.item)}</span><b class="${isHH?'hh':''}">${isHH?hhp:(reg+(hhp?' · '+hhp:''))}</b></div>`;
      }).join('')}</div>
      <div class="caddr">${esc(s.address||'')}</div>
      <button class="pin-link" data-pin="${s.guid}" type="button">Show on map</button>
    </div>`;
  }).join('');
  $('#cards').querySelectorAll('.pin-link').forEach(el=>el.addEventListener('click',()=>openMap(el.dataset.pin)));
  updateCNav();
}
function inBigHood(s){ const h=s.neighborhood||'Milwaukee'; return SPOTS.filter(x=>(x.neighborhood||'Milwaukee')===h&&!districtOf(x)).length>=3; }
function updateCNav(){
  const c=$('#cards'); const n=c.children.length; if(!n){$('#ccount').textContent='0 / 0';return;}
  const w=c.children[0].getBoundingClientRect().width+10;
  const i=Math.round(c.scrollLeft/w);
  $('#ccount').textContent=`${i+1} / ${n}`;
}
$('#cprev').addEventListener('click',()=>{const c=$('#cards');c.scrollBy({left:-(c.children[0].getBoundingClientRect().width+10),behavior:'smooth'});});
$('#cnext').addEventListener('click',()=>{const c=$('#cards');c.scrollBy({left:(c.children[0].getBoundingClientRect().width+10),behavior:'smooth'});});
$('#cards').addEventListener('scroll',()=>requestAnimationFrame(updateCNav));
$('#back-home').addEventListener('click',()=>{$('#view-d').classList.add('hidden');$('#view-home').classList.remove('hidden');renderHome();});
function popupHtml(s){
  return `<div style="font-weight:600;font-size:15px">${esc(s.name)}</div>`+
    s.items.map(it=>{const reg=it.price_cents?money(it.price_cents):'';const hhp=it.hh_price_cents?money(it.hh_price_cents)+' hh':'';
      const isHH=HH&&it.hh_price_cents;
      return `<div style="margin-top:6px;font-size:13px;display:flex;justify-content:space-between;gap:12px"><span>${esc(it.item)}</span><b style="font-family:'IBM Plex Mono',monospace;font-size:12px;${isHH?'color:var(--accent)':''}">${isHH?hhp:(reg+(hhp?' · '+hhp:''))}</b></div>`;}).join('')+
    `<div style="margin-top:7px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:#6F6A5E">${esc(s.address||'')}</div>`;
}
function openMap(guid){
  $('#map-overlay').classList.remove('hidden'); document.body.style.overflow='hidden';
  if(!MAP){ MAP=L.map('map',{scrollWheelZoom:false});
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(MAP); }
  Object.values(MARKERS).forEach(m=>m.remove()); MARKERS={};
  const list=SPOTS.filter(visible);
  const minP=Math.min(...list.map(shownPrice));
  list.forEach(s=>{ const cheap=shownPrice(s)===minP;
    const icon=L.divIcon({className:'',html:`<div class="price-pin${cheap?' cheapest':''}">${money(shownPrice(s))}</div>`,iconSize:null,iconAnchor:[20,14]});
    MARKERS[s.guid]=L.marker([s.lat,s.lng],{icon}).addTo(MAP).bindPopup(popupHtml(s)); });
  $('#map-title').textContent=`${list.length} spots, pinned`;
  setTimeout(()=>{ MAP.invalidateSize();
    if(guid&&MARKERS[guid]){ const s=list.find(x=>x.guid===guid); MAP.setView([s.lat,s.lng],15); MARKERS[guid].openPopup(); }
    else MAP.fitBounds(L.latLngBounds(list.map(s=>[s.lat,s.lng])).pad(0.08)); },60);
}
function closeMap(){ $('#map-overlay').classList.add('hidden'); document.body.style.overflow=''; }
$('#map-btn').addEventListener('click',()=>openMap());
$('#close-map').addEventListener('click',closeMap);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMap();});
$('#hh-btn').addEventListener('click',()=>{HH=!HH;$('#hh-btn').classList.toggle('on',HH);$('#hh-btn').setAttribute('aria-pressed',HH); if(CUR&&!$('#view-d').classList.contains('hidden')) openDistrict(CUR); else renderHome();});
$('#find').addEventListener('input',e=>{QUERY=e.target.value; if(CUR&&!$('#view-d').classList.contains('hidden')) openDistrict(CUR); else renderHome();});
fetch('data/martinis.json?v='+Date.now()).then(r=>r.json()).then(d=>{
  SPOTS=d.martinis;
  const dt=new Date(d.generated_at);
  const mon=dt.toLocaleString('en-US',{month:'short',timeZone:'America/Chicago'});
  const day=Number(dt.toLocaleString('en-US',{day:'numeric',timeZone:'America/Chicago'}));
  $('#stamp').textContent=`MILWAUKEE · ${SPOTS.length} SPOTS · UPDATED ${mon.toUpperCase()} ${day}`;
  $('#hh-btn').innerHTML=`Happy hour <sup>${SPOTS.filter(s=>s.happy_hour).length}</sup>`;
  renderHome();
});
</script>
</body>
</html>
